<div class="chat-log" id="chat-log">
  {% for m in history %}
    <div class="msg {{ m.role }}">{{ m.content }}</div>
  {% else %}
    <div class="empty">Nothing yet. Ask about a contact, log a meeting, or request the digest.</div>
  {% endfor %}
</div>
<form class="chat-form" hx-post="/chat" hx-target="#chat-panel" hx-swap="innerHTML"
      hx-indicator="#thinking" hx-on::after-request="this.reset()">
  <textarea name="message" rows="1" placeholder="Message the agent…" autofocus></textarea>
  <button type="submit" class="btn primary">Send</button>
</form>
<div class="spinner" id="thinking" style="margin-top:8px">Thinking…</div>
